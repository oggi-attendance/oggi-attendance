<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>OGGI Attendance</title>
<style>
  :root { --ink:#111; --muted:#666; --line:#e2e2e2; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
  body { background:#f4f4f4; color:var(--ink); }
  header { background:#000; color:#fff; padding:14px 16px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:5; }
  header img { width:44px; height:44px; border-radius:8px; }
  header .t { font-size:18px; font-weight:700; letter-spacing:.5px; }
  header .b { font-size:12px; color:#bbb; }
  main { max-width:520px; margin:0 auto; padding:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  h2 { font-size:16px; margin-bottom:10px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:12px; }
  button { cursor:pointer; border:none; border-radius:10px; font-size:15px; }
  .btn { display:block; width:100%; padding:13px; background:#000; color:#fff; font-weight:600; margin-top:10px; }
  .btn.light { background:#eee; color:#111; }
  .btn.wa { background:#1faa53; }
  input[type=text], input[type=date] { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
  .ot { display:flex; align-items:center; gap:6px; margin-top:6px; font-size:13px; color:var(--muted); }
  .ot input { width:72px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:none; }
  .name { font-size:15px; flex:1; }
  .seg { display:flex; gap:6px; }
  .seg button { width:44px; padding:8px 0; font-size:12px; font-weight:700; background:#f0f0f0; color:#555; border-radius:8px; }
  .seg button.on-P { background:#1faa53; color:#fff; }
  .seg button.on-A { background:#d33; color:#fff; }
  .seg button.on-HD { background:#e6a100; color:#fff; }
  .seg button.on-L { background:#2069d0; color:#fff; }
  .small { font-size:12px; color:var(--muted); }
  .report { white-space:pre-wrap; font-size:14px; line-height:1.55; background:#fafafa; border:1px solid var(--line); border-radius:10px; padding:12px; }
  .monthnav { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .monthnav button { background:#eee; padding:8px 14px; font-size:16px; }
  .totals { margin-top:10px; font-size:13px; color:var(--muted); }
  .linkish { background:none; color:#2069d0; font-size:13px; padding:4px; }
  .empty { color:var(--muted); font-size:14px; padding:12px 0; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#111; color:#fff; padding:10px 18px; border-radius:20px; font-size:14px; display:none; }
</style>
</head>

"use strict";
var KEY = "oggi.attendance.v1";
var STATUS = [["P","Present"],["A","Absent"],["HD","Half Day"],["L","Leave"]];
var EXEC = "https://script.google.com/macros/s/AKfycbxrkmX3MQFvkQdh6t4hHrFS0EcjjOpzwINI3UNl7hIqYlmgEkxAdAM68GH-4vPhenJl/exec";
var state = load();

function load() {
  try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.employees && s.att) {
    if (!s.ot) s.ot = {};
    if (!s.rev) s.rev = {};
    if (!s.changes) s.changes = {};
    return s;
  } } catch (e) {}
  return { branch:"", employees:[], att:{}, ot:{}, nextId:1, rev:{}, changes:{} };
}
function dirtyCount() { return Object.keys(state.changes || {}).length; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function today() { var d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function prettyDate(iso) { var d = new Date(iso+"T00:00:00"); return d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"}); }
function toast(msg) { var t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; setTimeout(function(){t.style.display="none";},2200); }
function esc(s) { return String(s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function active() { return state.employees.filter(function(e){return e.active;}); }

function header() {
  var el = document.getElementById("hdrBranch");
  var txt = state.branch ? ("Branch: " + state.branch) : "No branch set";
  if (state.mode === "owner") txt = "Owner view";
  else if (state.mode === "branch") txt = "Branch: " + state.branch + (dirtyCount() ? " · sync pending" : (state.lastSync ? " · synced" : ""));
  el.textContent = txt;
}

/* ---------- sync layer (branch / owner modes) ---------- */
var syncing = false;
function api(body) {
  return fetch(EXEC, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(body) })
    .then(function(r){ return r.json(); });
}
function authFailMsg(err) {
  if (err === "locked") return "Too many wrong tries. Wait 10 minutes and try again.";
  if (err === "network") return "No connection. Try again when online.";
  if (err === "no_invite") return "That invite code is not valid or has expired. Ask the owner for a new one.";
  if (err === "invite_used") return "That invite code was already used. Ask the owner for a new one.";
  return "Name or code wrong. Check and try again.";
}
function pushBranch(doneToast) {
  if (state.mode !== "branch" || !state.token || syncing) return;
  if (!dirtyCount()) { state.dirty = false; save(); header(); if (doneToast) toast("Saved and synced"); return; }
  syncing = true;
  var empById = {}; state.employees.forEach(function(e){ empById[e.id] = e; });
  var emps = [], recs = [], keys = [];
  Object.keys(state.changes).forEach(function(k){
    keys.push(k);
    if (k.indexOf("e|") === 0) {
      var e = empById[Number(k.slice(2))];
      if (e) emps.push({ id:e.id, name:e.name, active:!!e.active, base: state.rev[k] || null });
    } else {
      var p = k.split("|"), d = p[1], id = Number(p[2]);
      var s = (state.att[d] && state.att[d][id]) || null;
      var o = (state.ot[d] && state.ot[d][id]) || 0;
      recs.push({ date:d, id:id, name:(empById[id] ? empById[id].name : ""), status:s, ot:o, base: state.rev[k] || null });
    }
  });
  var payload = { action:"push", role:"branch", branch: state.token.branch_id, secret: state.token.secret,
    employees: emps, records: recs };
  api(payload).then(function(r){
    syncing = false;
    if (r && r.ok) {
      var conf = r.conflicts || [], confSet = {};
      conf.forEach(function(c){ confSet[c] = true; });
      keys.forEach(function(k){
        if (!confSet[k]) { state.rev[k] = r.ts; delete state.changes[k]; }
      });
      state.lastSync = new Date().toISOString(); state.dirty = dirtyCount() > 0; save(); header();
      if (conf.length) { toast("Some records were changed on another phone. Pulling the latest."); pullBranch(function(){ home(); }); }
      else if (doneToast) toast("Saved and synced");
    }
    else { state.dirty = true; save(); header(); toast("Saved on this phone. Sync failed, will retry."); }
  }, function(){ syncing = false; state.dirty = true; save(); header(); toast("Saved on this phone. Sync failed, will retry."); });
}
function mergeRemote(r) {
  var rem = { employees:[], att:{}, ot:{} };
  var remRevE = {}, remRevA = {};
  (r.employees || []).forEach(function(row){ rem.employees.push({ id:Number(row[0]), name:row[1], active:!!row[2] }); remRevE[row[0]] = String(row[4] || ""); });
  (r.attendance || []).forEach(function(row){
    var d = row[0], id = String(row[1]);
    if (row[2]) { (rem.att[d] = rem.att[d] || {})[id] = row[2]; }
    var o = parseFloat(row[3]); if (o > 0) (rem.ot[d] = rem.ot[d] || {})[id] = o;
    remRevA[d + "|" + row[1]] = String(row[5] || "");
  });
  // Map local employee ids to server ids: same id+name = same person; same name =
  // same person under the server's id; anything else becomes a new employee.
  var remById = {}, remIdByName = {};
  rem.employees.forEach(function(e){ remById[e.id] = e; remIdByName[String(e.name).toLowerCase()] = e.id; });
  var maxId = 0;
  rem.employees.forEach(function(e){ maxId = Math.max(maxId, e.id); });
  state.employees.forEach(function(e){ maxId = Math.max(maxId, e.id); });
  var idMap = {};
  state.employees.forEach(function(e){
    var ri = remById[e.id];
    if (ri && String(ri.name).toLowerCase() === String(e.name).toLowerCase()) { idMap[e.id] = e.id; return; }
    var byName = remIdByName[String(e.name).toLowerCase()];
    if (byName != null) { idMap[e.id] = byName; return; }
    idMap[e.id] = ++maxId;
  });
  var latt = {}, lot = {}, d, k;
  for (d in state.att) { for (k in state.att[d]) { var ta = idMap[k]; if (ta != null) { (latt[d]=latt[d]||{})[ta] = state.att[d][k]; } } }
  for (d in state.ot) { for (k in state.ot[d]) { var to = idMap[k]; if (to != null) { (lot[d]=lot[d]||{})[to] = state.ot[d][k]; } } }
  var byId = {};
  rem.employees.forEach(function(e){ byId[e.id] = e; });
  state.employees.forEach(function(e){ var t = idMap[e.id]; if (!byId[t]) byId[t] = { id:t, name:e.name, active:!!e.active }; });
  var fatt = {}, fot = {};
  for (d in latt) { for (k in latt[d]) { (fatt[d]=fatt[d]||{})[k] = latt[d][k]; } }
  for (d in lot) { for (k in lot[d]) { (fot[d]=fot[d]||{})[k] = lot[d][k]; } }
  for (d in rem.att) { for (k in rem.att[d]) { (fatt[d]=fatt[d]||{})[k] = rem.att[d][k]; } }
  for (d in rem.ot) { for (k in rem.ot[d]) { (fot[d]=fot[d]||{})[k] = rem.ot[d][k]; } }
  // Remap pending changes and base revisions through the employee id map.
  var nch = {}, nrv = {}, ck;
  for (ck in (state.changes || {})) {
    var parts = ck.split("|");
    if (parts[0] === "e") nch["e|" + (idMap[Number(parts[1])] != null ? idMap[Number(parts[1])] : parts[1])] = true;
    else nch["a|" + parts[1] + "|" + (idMap[Number(parts[2])] != null ? idMap[Number(parts[2])] : parts[2])] = true;
  }
  for (ck in (state.rev || {})) {
    var rp = ck.split("|");
    if (rp[0] === "e") nrv["e|" + (idMap[Number(rp[1])] != null ? idMap[Number(rp[1])] : rp[1])] = state.rev[ck];
    else nrv["a|" + rp[1] + "|" + (idMap[Number(rp[2])] != null ? idMap[Number(rp[2])] : rp[2])] = state.rev[ck];
  }
  // For every record the server has: if our pending change is based on an
  // older version, the server wins and the change is dropped. If our change
  // is based on exactly this version, keep it for the next push.
  rem.employees.forEach(function(e){
    var key = "e|" + e.id, u = remRevE[e.id];
    if (nch[key] && nrv[key] !== u) { delete nch[key]; nrv[key] = u; }
    else if (!nch[key]) nrv[key] = u;
  });
  Object.keys(remRevA).forEach(function(dk){
    var key = "a|" + dk, u = remRevA[dk];
    if (nch[key] && nrv[key] !== u) { delete nch[key]; nrv[key] = u; }
    else if (!nch[key]) nrv[key] = u;
  });
  state.changes = nch; state.rev = nrv;
  // A record the server holds WITHOUT OT clears any local OT for it
  // (e.g. another phone cleared it), unless that change is pending push.
  for (d in rem.att) { for (k in rem.att[d]) {
    var kk = "a|" + d + "|" + k;
    if (!(rem.ot[d] && rem.ot[d][k] != null) && !nch[kk]) { if (fot[d]) delete fot[d][k]; }
  } }
  var needPush = dirtyCount() > 0;
  state.employees = Object.keys(byId).map(function(kk){ return byId[kk]; }).sort(function(a,b){ return a.id-b.id; });
  state.nextId = state.employees.reduce(function(m,e){ return Math.max(m, e.id+1); }, 1);
  state.att = fatt; state.ot = fot;
  state.branch = r.branch;
  save();
  return needPush;
}
function pullBranch(done) {
  if (state.mode !== "branch" || !state.token) { if (done) done(false, "not_branch"); return; }
  api({ action:"pull", role:"branch", branch: state.token.branch_id, secret: state.token.secret }).then(function(r){
    if (r && r.ok) {
      var needPush = mergeRemote(r);
      state.lastSync = new Date().toISOString(); state.dirty = dirtyCount() > 0; save(); header();
      if (needPush) pushBranch(false);
      if (done) done(true);
    } else if (done) done(false, r && r.error);
  }, function(){ if (done) done(false, "network"); });
}

function genToken() {
  var a = new Uint8Array(16);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  else for (var i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256);
  var h = ""; for (var j = 0; j < a.length; j++) h += ("0" + a[j].toString(16)).slice(-2);
  return h;
}

/* ---------- mode selection, login, registration ---------- */
function chooseMode() {
  var v = document.getElementById("view");

}
function setLocal() { state.mode = "local"; save(); boot(); }
function finishBranchLogin(branchName, secret, branchId) {
  var hasLocal = state.employees.length > 0 || Object.keys(state.att).length > 0;
  if (hasLocal && state.branch && state.branch !== branchName) { showLocalConflict(branchName, secret, branchId); return; }
  state.mode = "branch"; state.token = { branch: branchName, branch_id: branchId, secret: secret }; save();
  pullBranch(function(ok){ if (!ok) toast("Signed in. Sync failed, will retry."); });
  toast("Signed in"); home();
}
function showLocalConflict(branchName, secret, branchId) {
  var v = document.getElementById("view");
  v.innerHTML = '<div class="card"><h2>Records on this phone</h2>'+
    '<div class="sub">This phone already has records for "'+esc(state.branch)+'". Upload them into branch "'+esc(branchName)+'"?</div>'+
    '<button class="btn" id="cfYes">Upload into '+esc(branchName)+'</button>'+
    '<button class="btn light" id="cfLocal">Keep this phone separate (stay local)</button>'+
    '<button class="btn light" onclick="boot()">Cancel</button></div>';
  document.getElementById("cfYes").onclick = function(){
    state.mode = "branch"; state.token = { branch: branchName, branch_id: branchId, secret: secret }; state.branch = branchName;
    state.employees.forEach(function(e){ state.changes["e|" + e.id] = true; });
    var dd, ii;
    for (dd in state.att) for (ii in state.att[dd]) state.changes["a|" + dd + "|" + ii] = true;
    for (dd in state.ot) for (ii in state.ot[dd]) state.changes["a|" + dd + "|" + ii] = true;
    save();
    pullBranch(function(){});
    toast("Uploading this phone's records"); home();
  };
  document.getElementById("cfLocal").onclick = function(){ state.mode = "local"; save(); home(); };
}

function renderOwnerDash() {
  header();
  var v = document.getElementById("view");

  var cards = (r.branches || []).map(function(b, i){
    var bid = b[0], bn = b[1], hasPhone = !!b[2];
    var emps = (r.employees || []).filter(function(e){ return e[3] === bid && e[2]; });
    var att = (r.attendance || []).filter(function(a){ return a[4] === bid && a[0] === t; });
    var c = {P:0,A:0,HD:0,L:0}, ot = 0;
    att.forEach(function(a){ if (c[a[2]] != null) c[a[2]]++; var x = parseFloat(a[3]); if (x > 0) ot += x; });
    return '<div class="card"><h2>'+esc(bn)+'</h2>'+
      '<div class="sub">'+emps.length+' employees &middot; '+att.length+' marked today'+(hasPhone ? '' : ' &middot; no phone linked')+'</div>'+
      '<div class="small">P '+c.P+' &middot; A '+c.A+' &middot; HD '+c.HD+' &middot; L '+c.L+' &middot; OT '+(Math.round(ot*100)/100)+'h</div>'+

    (cards || '<div class="card"><div class="empty">No branches yet. Add one to get an invite code for its phone.</div></div>');
}
function ownerBranch(i) {
  var r = ownerData, bid = r.branches[i][0], bn = r.branches[i][1], t = today();
  var prefix = t.slice(0,7);
  var emps = (r.employees || []).filter(function(e){ return e[3] === bid && e[2]; });
  var rows = emps.map(function(e){
    var id = e[0], name = e[1];
    var todayRow = (r.attendance || []).filter(function(a){ return a[4] === bid && a[0] === t && Number(a[1]) === id; })[0];
    var s = todayRow ? todayRow[2] : "", ot = todayRow ? parseFloat(todayRow[3]) || 0 : 0;
    var label = s ? STATUS.filter(function(x){ return x[0] === s; })[0][1] : "Not marked";
    var c = {P:0,A:0,HD:0,L:0}, mot = 0;
    (r.attendance || []).forEach(function(a){
      if (a[4] === bid && Number(a[1]) === id && a[0].indexOf(prefix) === 0) {
        if (c[a[2]] != null) c[a[2]]++;
        var x = parseFloat(a[3]); if (x > 0) mot += x;
      }
    });
    return '<div class="row"><div class="name">'+esc(name)+
      '<div class="small">Today: '+label+(ot ? (" · OT "+ot+"h") : "")+'<br>This month: P '+c.P+' &middot; A '+c.A+' &middot; HD '+c.HD+' &middot; L '+c.L+' &middot; OT '+(Math.round(mot*100)/100)+'h</div></div></div>';
  }).join("");
  document.getElementById("view").innerHTML =
    '<div class="card"><h2>'+esc(bn)+'</h2><div class="sub">'+prettyDate(t)+' &middot; '+emps.length+' employees</div>'+
    (rows || '<div class="empty">No employees yet.</div>')+
    '<button class="btn light" onclick="ownerInvite('+i+')">New invite code</button>'+
    '<button class="linkish" onclick="ownerRevoke('+i+')">Revoke phone access</button>'+
    '<button class="btn light" onclick="renderOwnerDash()">Back to all branches</button></div>';
}

function removeEmp(id) {

function goMark() {
  header();
  var list = active();
  var v = document.getElementById("view");
  if (!list.length) { v.innerHTML='<div class="card"><div class="empty">Add employees first.</div><button class="btn light" onclick="goEmployees()">Go to employees</button></div>'; return; }
  var marks = state.att[today()] || {};
  var otDay = (state.ot && state.ot[today()]) || {};
  var rows = list.map(function(e){
    var cur = marks[e.id] || "";
    var otVal = (otDay[e.id]!=null) ? otDay[e.id] : "";
    var seg = STATUS.map(function(s){
      return '<button id="m'+e.id+s[0]+'" class="'+(cur===s[0]?("on-"+s[0]):"")+'" onclick="mark('+e.id+',\''+s[0]+'\')">'+s[0]+'</button>';
    }).join("");
    return '<div class="row"><div style="flex:1"><div class="name">'+esc(e.name)+'</div>'+
      '<div class="ot">OT hours <input type="number" inputmode="decimal" min="0" step="0.5" id="ot'+e.id+'" value="'+otVal+'"></div></div>'+
      '<div class="seg">'+seg+'</div></div>';
  }).join("");
  v.innerHTML = '<div class="card"><h2>'+prettyDate(today())+'</h2>'+
    '<div class="sub">P = Present &middot; A = Absent &middot; HD = Half Day &middot; L = Leave &middot; OT = overtime hours (optional)</div>'+
    rows+
    '<button class="btn" onclick="saveMarks()">Save attendance</button>'+
    '<button class="btn light" onclick="home()">Back</button></div>';
}
var pending = {};
function mark(id, s) {
  pending[id] = s;
  STATUS.forEach(function(x){ document.getElementById("m"+id+x[0]).className = (x[0]===s)?("on-"+x[0]):"" ; });
}
function saveMarks() {
  var d = today();
  if (!state.att[d]) state.att[d] = {};
  for (var k in pending) { state.att[d][k] = pending[k]; state.changes["a|" + d + "|" + k] = true; }
  pending = {};
  if (!state.ot) state.ot = {};
  var oldOt = state.ot[d] || {};
  var otDay = {};
  active().forEach(function(e){
    var el = document.getElementById("ot"+e.id);
    if (!el) return;
    var n = parseFloat(el.value);
    if (!isNaN(n) && n > 0) otDay[e.id] = Math.round(n*100)/100;
  });
  // OT tombstones: any employee whose OT changed (added, edited or cleared)
  // gets a change marker, so a cleared OT is pushed as an explicit zero.
  var ids = {}; Object.keys(oldOt).forEach(function(i){ ids[i]=1; }); Object.keys(otDay).forEach(function(i){ ids[i]=1; });
  Object.keys(ids).forEach(function(i){ if (oldOt[i] !== otDay[i]) state.changes["a|" + d + "|" + i] = true; });
  if (Object.keys(otDay).length) state.ot[d] = otDay; else delete state.ot[d];
  save(); toast("Attendance saved"); pushBranch(false); home();
}

function reportText(dateIso) {
  var marks = state.att[dateIso] || {};
  var otDay = (state.ot && state.ot[dateIso]) || {};
  var list = active();
  var counts = {P:0,A:0,HD:0,L:0};
  var lines = list.map(function(e,i){
    var s = marks[e.id] || "";
    var label = s ? STATUS.filter(function(x){return x[0]===s;})[0][1] : "Not marked";
    if (s) counts[s]++;
    var ot = otDay[e.id];
    return (i+1)+". "+e.name+" - "+label+(ot?(" (OT "+ot+"h)"):"");
  });
  var un = list.length - counts.P - counts.A - counts.HD - counts.L;
  var otTotal = 0; for (var id in otDay) otTotal += otDay[id];
  otTotal = Math.round(otTotal*100)/100;
  return "OGGI ATTENDANCE\nBranch: "+(state.branch||"-")+"\nDate: "+prettyDate(dateIso)+"\n\n"+
    (lines.join("\n")||"No employees")+
    "\n\nPresent: "+counts.P+"  Absent: "+counts.A+"  Half Day: "+counts.HD+"  Leave: "+counts.L+(un?("  Not marked: "+un):"")+(otTotal?("  OT total: "+otTotal+"h"):"");
}

  else toast("Copy not available");
}

var monthCursor = (function(){var d=new Date(); return {y:d.getFullYear(), m:d.getMonth()};})();
function goMonthly() {
  header();
  var v = document.getElementById("view");
  var prefix = monthCursor.y+"-"+String(monthCursor.m+1).padStart(2,"0");
  var label = new Date(monthCursor.y, monthCursor.m, 1).toLocaleDateString("en-IN",{month:"long",year:"numeric"});
  var rows = active().map(function(e){
    var c = {P:0,A:0,HD:0,L:0};
    for (var d in state.att) {
      if (d.indexOf(prefix)===0 && state.att[d][e.id]) c[state.att[d][e.id]]++;
    }
    var otSum = 0;
    if (state.ot) for (var d2 in state.ot) {
      if (d2.indexOf(prefix)===0 && state.ot[d2][e.id]) otSum += state.ot[d2][e.id];
    }
    otSum = Math.round(otSum*100)/100;
    return '<div class="row"><div class="name">'+esc(e.name)+'<div class="small">P '+c.P+' &middot; A '+c.A+' &middot; HD '+c.HD+' &middot; L '+c.L+' &middot; OT '+otSum+'h</div></div></div>';
  }).join("");
  v.innerHTML = '<div class="card"><div class="monthnav">'+
    '<button onclick="shiftMonth(-1)">&larr;</button><h2>'+label+'</h2><button onclick="shiftMonth(1)">&rarr;</button></div>'+
    (rows||'<div class="empty">No employees yet.</div>')+
    '<div class="totals">Counts only. Overtime is recorded in hours only; no pay is calculated.</div>'+
    '<button class="btn light" onclick="home()">Back</button></div>';
}
function shiftMonth(d) {
  monthCursor.m += d;
  if (monthCursor.m<0) { monthCursor.m=11; monthCursor.y--; }
  if (monthCursor.m>11) { monthCursor.m=0; monthCursor.y++; }
  goMonthly();
}

/* ---------- boot ---------- */
function boot() {
  header();
  if (state.mode === "branch" && (!state.token || !state.token.branch_id)) state.mode = "local";
  if (state.mode === "owner") { ownerHome(); return; }
  if (!state.mode && !state.branch && !state.employees.length) { chooseMode(); return; }
  if (!state.branch) { goBranch(); return; }
  home();
  if (state.mode === "branch") pullBranch(function(){ home(); });
}

document.getElementById("logoImg").src = LOGO_DATA;
boot();
</script>
